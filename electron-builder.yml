# electron-builder 配置。
#
# 目标：Windows 上产出 NSIS 安装包与免安装 portable exe。
# mpv 作为独立可执行文件随包分发（extraResources），主进程用
# `resolveMpvBinary()` 在 process.resourcesPath/mpv 下找它。
appId: im.youyou.music
productName: YouyouMusic
copyright: LGPL-3.0-only

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/node_modules/**/{test,__tests__,tests,examples,example,doc,docs}/**'

extraResources:
  # 音频后端。缺失也能启动（会提示播放不可用），但正常发布应包含它。
  - from: vendor/mpv
    to: mpv
    filter:
      - '**/*'
  # 托盘图标与安装目录内的许可说明（许可文本随包分发，但不出现在界面里）。
  - from: build/icon.png
    to: icon.png
  - from: THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt

asar: true
asarUnpack:
  # 没有需要解包的运行时依赖：mpv 走 extraResources，不走 asar。

afterPack: scripts/after-pack.cjs

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: build/icon.ico
  # 关闭 electron-builder 自带的 exe 资源编辑与签名。
  #
  # 原因：那条路径会解压 winCodeSign 包，而包里含 macOS 符号链接
  # （darwin/10.12/lib/libcrypto.dylib 等）。在未开启「开发者模式」且非管理员的
  # Windows 上创建符号链接会被拒绝，解压报错后整条打包中断。
  # 图标与版本信息改由 afterPack 钩子调用 rcedit 直接写入（scripts/after-pack.cjs），
  # 效果一致且不需要解压那个包。
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 安装后的快捷方式与卸载项显示中文名（exe 文件名保持 ASCII，避免路径与签名问题）
  shortcutName: 悠悠音乐
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # 按用户要求命名：悠悠音乐安装版+版本号（更新源按「便携版/安装版」关键词匹配资产）
  artifactName: 悠悠音乐安装版${version}.${ext}

portable:
  artifactName: 悠悠音乐便携版${version}.${ext}

# 内置更新（自研，走 GitHub Releases 最新版资产），不使用 electron-updater 发布配置。
publish: null
